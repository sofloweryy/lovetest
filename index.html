<!DOCTYPE html>
<html lang="zh-CN">

  <style>

      padding: 6px 16px;

      display: inline-block;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .main-title {
      color: #333;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .box {
      border: 2px solid #a8c5ff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 15px;
      background-color: #f4f8ff;
    }
    .score-box {

      border-radius: 16px;
      padding: 15px;

      font-weight: bold;

    }
    .section-card {

      text-align: left;

      color: #333;

    }

</html>
