<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星座与 MBTI · 双重恋爱基因测算</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fceef3;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .header-tag {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .main-title {
      color: #ff4d79;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .box {
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      background-color: #fff9fb;
    }
    .score-box {
      border: 2px solid #ff758c;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      background: linear-gradient(180deg, #ffffff, #fff0f3);
    }
    .score-num {
      font-size: 36px;
      font-weight: bold;
      color: #ff3366;
      margin: 8px 0;
    }
    .section-card {
      background: #fafafa;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
      text-align: left;
      border-left: 4px solid #ff758c;
    }
    .section-card-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .section-card-content {
      color: #555;
      font-size: 13px;
      line-height: 1.4;
    }
    .footer-note {
      font-size: 11px;
      color: #999;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <!-- 头部标识 -->
    <div>
      <span class="header-tag">🔮 星座与 MBTI · 双重恋爱基因测算</span>
    </div>
    
    <div class="subtitle">我的性格：<span id="userPersona" style="font-weight:bold; color:#333;">ESTP × 白羊座</span></div>
    <div class="main-title">命中注定另一半</div>

    <!-- 另一半匹配结果框 -->
    <div class="box">
      <div id="targetResult" style="font-size: 20px; font-weight: bold; color: #ff3366;">加载中...</div>
    </div>

    <!-- 契合指数框 -->
    <div class="score-box">
      <div style="font-size: 13px; color: #666;">💖 灵魂契合指数 · 命中注定的双向奔赴</div>
      <div class="score-num" id="scoreDisplay">97.3%</div>
    </div>

    <!-- 详细解析卡片 -->
    <div class="section-card">
      <div class="section-card-title">另一半画像</div>
      <div class="section-card-content" id="portraitContent">加载中...</div>
    </div>

    <div class="section-card">
      <div class="section-card-title">灵魂默契</div>
      <div class="section-card-content" id="soulContent">加载中...</div>
    </div>

    <div class="section-card">
      <div class="section-card-title">避坑指南</div>
      <div class="section-card-content" id="avoidContent">加载中...</div>
    </div>

    <div class="section-card">
      <div class="section-card-title">升温建议</div>
      <div class="section-card-content" id="warmContent">加载中...</div>
    </div>

    <div class="footer-note">
      测测命中另一半的星座与MBTI<br>仅供娱乐，如不雷同概不负责（嘿嘿😄
    </div>
  </div>

  <script>
    // 模拟当前用户的 MBTI（你可以根据需要修改这里或接动态传参）
    const mbti = "ESTP"; 

    // 全量专属文案映射：每一组都严格贴合对应 MBTI 及星座的真实性格特质
    const targetMap = {
      'ESTP': { 
        target: 'ISFJ 守卫者 × 双鱼座', 
        portrait: '你的本命另一半是标准的【ISFJ 守卫者 × 双鱼座】，自带“温柔包容、极具耐心、敏感细腻、润物细无声”的特质。TA也许不会说特别轰轰烈烈的情话，但会在生活的细微处给你最稳妥的照顾。',
        soul: '你们的组合充满“治愈与共鸣”。ISFJ 的脚踏实地与双鱼座的浪漫幻想完美交织，TA能够敏锐地捕捉到你所有藏在坚强背后的疲惫和欲言又止，是一个能让你卸下所有防备的避风港。',
        avoid: '⚠️ 避坑小提醒：多给承诺，避免冷暴力。ISFJ 和双鱼座在感情里都属于容易内耗的类型，遇到矛盾时习惯默默生闷气。如果此时你表现得不耐烦或冷战，TA 的内心会大崩塌。',
        warm: '💡 互动升温秘诀：深夜掏心窝的聊天，或一起布置温馨小窝。相比于大风大浪的刺激活动，TA 更享受安静、具有仪式感的相处，能让TA感受到被爱包围的幸福。'
      },
      'INTJ': { 
        target: 'ENFP 竞选者 × 天秤座', 
        portrait: '你的本命另一半是【ENFP 竞选者 × 天秤座】，自带“热情开朗、脑洞大开、极具感染力”的特质。TA能用天然的灵动与外向，完美融化你骨子里的理性与高冷。',
        soul: '属于智性恋与灵魂共振的顶级搭配。一个负责深度思考与构筑宏大蓝图，一个负责把快乐和新鲜感带进现实，在一起永远有说不完的话。',
        avoid: '⚠️ 避坑小提醒：不要习惯性地用理性去否定或泼TA冷水。ENFP 非常需要情绪价值和正向反馈，冷冰冰的逻辑容易让TA感到沮丧。',
        warm: '💡 互动升温秘诀：偶尔抛开严谨的计划和目标，和TA一起去尝试一场毫无目的的即兴旅行或新鲜体验。'
      },
      'ENFP': { 
        target: 'INTJ 建筑师 × 水瓶座', 
        portrait: '你的本命另一半是【INTJ 建筑师 × 水瓶座】，自带“理性冷静、思维深邃、逻辑严密”的特质。TA拥有能一眼看穿你百变脑洞的智慧。',
        soul: '外向小太阳与清冷智者的神仙组合。TA虽然不擅长甜言蜜语，但会在你需要的时候提供最靠谱的全局分析和最坚实的隐形后盾。',
        avoid: '⚠️ 避坑小提醒：不要试图过分约束TA的个人空间。INTJ/水瓶座非常需要独处的绝对宁静，给彼此空间反而能让感情更长久。',
        warm: '💡 互动升温秘诀：进行一次深夜的深度思想碰撞，或者一起去图书馆、安静的书店享受并肩作战却各自专注的陪伴。'
      },
      'INFJ': { 
        target: 'ENTP 辩论家 × 双子座', 
        portrait: '你的本命另一半是【ENTP 辩论家 × 双子座】，自带“思维敏捷、幽默风趣、善于打破常规”的特质。TA能用满脑子的奇思妙想，带你看到世界广袤有趣的一面。',
        soul: '直觉型人格的高阶碰撞。INFJ 的深沉内敛与 ENTP 的跳跃发散完美互补，两人既能进行高深的精神探讨，又能碰撞出无数快乐的火花。',
        avoid: '⚠️ 避坑小提醒：切忌过度情绪内耗。INFJ 习惯把话藏在心里，而 ENTP 倾向于直率表达，遇到误会时必须及时沟通，避免冷战。',
        warm: '💡 互动升温秘诀：来一场头脑风暴式的深夜畅聊，或者一起去探索一个从未去过的新奇城市角落。'
      }
    };

    // 如果匹配不到具体的，给一个高质感的默认兜底配置
    const currentInfo = targetMap[mbti] || {
      target: 'INFJ 提倡者 × 天蝎座',
      portrait: '你的本命另一半是深度共情、细腻敏感的灵魂伴侣，自带“默默守护、直觉敏锐、极度专一”的特质，能读懂你所有的言外之意。',
      soul: '彼此有着极强的灵魂吸引力，能够进行无需多言的深层次精神交流，属于命中注定的灵魂契合。',
      avoid: '⚠️ 避坑小提醒：开诚布公，切忌隐瞒真实想法。真诚永远是这段关系里的唯一必杀技。',
      warm: '💡 互动升温秘诀：远离喧嚣的人群，进行一场一对一的深度走心对话或安静的烛光晚餐。'
    };

    // 固定计算契合度分数（保证同一个 MBTI 算出的契合指数恒定不变）
    let charSum = 0;
    for (let i = 0; i < mbti.length; i++) {
      charSum += mbti.charCodeAt(i);
    }
    const fixedScore = (92.0 + (charSum % 79) / 10).toFixed(1) + '%';

    // 动态渲染到页面上
    document.getElementById('targetResult').innerText = currentInfo.target;
    document.getElementById('scoreDisplay').innerText = fixedScore;
    document.getElementById('portraitContent').innerText = currentInfo.portrait;
    document.getElementById('soulContent').innerText = currentInfo.soul;
    document.getElementById('avoidContent').innerText = currentInfo.avoid;
    document.getElementById('warmContent').innerText = currentInfo.warm;
  </script>

</body>
</html>
