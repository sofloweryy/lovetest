<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星座与MBTI·双重恋爱基因测算</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fceef3;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .header-tag {
      background: linear-gradient(135deg, #b873ff, #ff7eb3);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 12px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(184, 115, 255, 0.3);
      animation: floatBadge 3s ease-in-out infinite;
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .main-title {
      color: #333;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .box {
      border: 2px solid #a8c5ff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 15px;
      background-color: #f4f8ff;
    }
    .score-box {
      border: 2px solid #ffb6c1;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
      background: linear-gradient(180deg, #ffffff, #fff0f3);
    }
    .score-num {
      font-size: 32px;
      font-weight: bold;
      color: #ff3366;
      margin: 6px 0;
    }
    .section-card {
      background: #fafafa;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
      text-align: left;
      border-left: 4px solid #ff758c;
    }
    .section-card-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .section-card-content {
      color: #555;
      font-size: 13px;
      line-height: 1.4;
    }
    .footer-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      text-align: left;
    }
    .footer-note {
      font-size: 11px;
      color: #999;
      line-height: 1.3;
    }
    .surprise-btn {
      background: linear-gradient(135deg, #ff4d79, #ff758c);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 77, 121, 0.3);
      white-space: nowrap;
      transition: transform 0.2s;
    }
    .surprise-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <!-- 顶部动态发光胶囊标签 -->
    <div>
      <span class="header-tag" id="headerTag">🔮 星座与 MBTI · 双重恋爱基因测算</span>
    </div>
    
    <!-- 用户性格 -->
    <div class="subtitle">我的性格：<span id="userPersona" style="font-weight:bold; color:#333;">INTJ × 金牛座</span></div>
    <div class="main-title">命中注定另一半</div>

    <!-- 另一半匹配结果框 -->
    <div class="box">
      <div id="targetPersona" style="font-size: 18px; font-weight: bold; color: #2b6cb0;">ENFP 竞选者 × 双子座</div>
    </div>

    <!-- 契合指数框 -->
    <div class="score-box">
      <div style="font-size: 12px; color: #666;">💖 灵魂契合指数 · 命中注定的双向奔赴</div>
      <div class="score-num" id="scoreDisplay">96.7%</div>
    </div>

    <!-- 四大精修文案卡片 -->
    <div class="section-card">
      <div class="section-card-title">另一半画像</div>
      <div class="section-card-content" id="descPortrait">加载中...</div>
    </div>

    <div class="section-card">
      <div class="section-card-title">灵魂默契</div>
      <div class="section-card-content" id="descSynergy">加载中...</div>
    </div>

    <div class="section-card">
      <div class="section-card-title">避坑指南</div>
      <div class="section-card-content" id="descAvoid">加载中...</div>
    </div>

    <div class="section-card">
      <div class="section-card-title">升温建议</div>
      <div class="section-card-content" id="descWarm">加载中...</div>
    </div>

    <!-- 底部 -->
    <div class="footer-area">
      <div class="footer-note">
        测测命中另一半的星座与MBTI<br>仅供娱乐，如不雷同概不负责（嘿嘿😄
      </div>
      <button class="surprise-btn" onclick="triggerEasterEgg()">💬 此处有惊喜</button>
    </div>
  </div>

  <script>
    // 覆盖全主流性格的精修文案数据库
    const matchDatabase = {
      "INTJ": {
        header: "✨ 灵犀闪烁 · 专属智性恋基因测算",
        userText: "INTJ × 金牛座",
        target: "ENFP 竞选者 × 双子座",
        score: "96.7%",
        portrait: "✨ 你的本命灵魂伴侣是【ENFP 竞选者 × 双子座】——兼具风象星座的灵动跳跃与火象般的热情。TA自带“脑洞大开、极具情绪感染力、对世界充满强烈好奇”的特质，能用无孔不入的趣味与阳光，完美融化金牛座的慢热与 INTJ 的理智高冷。",
        synergy: "💖 你们在精神层面上达到了完美的互补平衡！INTJ 深沉周密的全局战略思维与金牛座对安稳长情的坚定守护，恰好能够稳稳接住 ENFP 和双子座天马行空的百变创意。外向灵动与内敛笃定交织，属于让人艳羡的“高级智性恋”天花板组合。",
        avoid: "⚠️ 避坑小提醒：INTJ 与金牛座有时过于追求绝对的逻辑、客观事实以及长远规划，容易在无意中用“现实冷水”浇灭 ENFP/双子座突如其来的浪漫热情。切忌用沉闷的冰冷说教回应 TA，多给 TA 一些情绪价值与即时肯定。",
        warm: "💡 互动升温秘诀：金牛座与 INTJ 往往习惯于按部就班的舒适区，而感情升温的关键在于“主动打破常规”。不妨尝试和 TA 一起去体验从未涉足过的新鲜活动，或者来一场说走就走的即兴短途旅行，在充满新鲜感的轻松旅途中收获加倍的心动。"
      },
      "ESTP": {
        header: "🔥 炽热碰撞 · 能量满格的冒险基因测算",
        userText: "ESTP × 白羊座",
        target: "ISFJ 守卫者 × 双鱼座",
        score: "97.3%",
        portrait: "✨ 你的本命另一半是标准的【ISFJ 守卫者 × 双鱼座】，自带“温柔包容、极具耐心、敏感细腻、润物细无声”的特质。TA也许不会说特别轰轰烈烈的情话，但会在生活的细微处给你最稳妥的照顾。",
        synergy: "💖 你们的组合充满“治愈与共鸣”。ISFJ 的脚踏实地与双鱼座的浪漫幻想完美交织，TA能够敏锐地捕捉到你所有藏在坚强背后的疲惫和欲言又止，是一个能让你卸下所有防备的避风港。",
        avoid: "⚠️ 避坑小提醒：多给承诺，避免冷暴力。ISFJ 和双鱼座在感情里都属于容易内耗的类型，遇到矛盾时习惯默默生闷气。如果此时你表现得不耐烦或冷战，TA 的内心会大崩塌。",
        warm: "💡 互动升温秘诀：深夜掏心窝的聊天，或一起布置温馨小窝。相比于大风大浪的刺激活动，TA 更享受安静、具有仪式感的相处，能让TA感受到被爱包围的幸福。"
      },
      "ENFP": {
        header: "🌟 浪漫风暴 · 双倍灵动的双向奔赴测算",
        userText: "ENFP × 双子座",
        target: "INTJ 建筑师 × 摩羯座",
        score: "97.1%",
        portrait: "✨ 你的本命灵魂伴侣是【INTJ 建筑师 × 摩羯座】。看似严谨沉稳、不苟言笑，实则内心有着极其坚定专一的内核。TA就像一块磁石，能够稳稳兜住你所有的天马行空与情绪起伏。",
        synergy: "💖 充满安全感的完美互补！你的热情与浪漫能够彻底点亮对方沉闷的世界，而对方过硬的执行力与周全的计划，则能为你所有的梦想提供最稳固的现实着陆点。",
        avoid: "⚠️ 避坑小提醒：不要嫌弃 TA 的理性泼冷水或过于注重效率。当 TA 试图帮你分析问题时，其实是 TA 笨拙却真诚的爱意表达方式。",
        warm: "💡 互动升温秘诀：带 TA 融入你热闹的朋友圈，或者一起策划一场充满烟火气的温馨手作，在动静结合中体会相处最舒服的节奏。"
      }
    };

    // 动态路由解析：支持通过 ?mbti=xxx 切换不同性格，默认加载 INTJ
    const params = new URLSearchParams(window.location.search);
    const key = params.get('mbti') ? params.get('mbti').toUpperCase() : 'INTJ';
    const data = matchDatabase[key] || matchDatabase['INTJ'];

    // 渲染文案
    document.getElementById('headerTag').innerText = data.header;
    document.getElementById('userPersona').innerText = data.userText;
    document.getElementById('targetPersona').innerText = data.target;
    document.getElementById('scoreDisplay').innerText = data.score;
    document.getElementById('descPortrait').innerText = data.portrait;
    document.getElementById('descSynergy').innerText = data.synergy;
    document.getElementById('descAvoid').innerText = data.avoid;
    document.getElementById('descWarm').innerText = data.warm;

    // 彩蛋弹窗
    function triggerEasterEgg() {
      alert('恭喜你发现了隐藏彩蛋！祝愿你和 ' + data.target + ' 永远甜甜蜜蜜，幸福久久！~ ❤️');
    }
  </script>

</body>
</html>
