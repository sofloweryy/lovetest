<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱情测试</title>
    <!-- 引入 Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #fdf5f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 192, 203, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #ff6b81;
            font-size: 24px;
        }
        .error-message {
            color: #d63031;
            font-weight: bold;
            padding: 20px 0;
        }
        /* 隐藏各个区块，用JS控制显示 */
        #loading, #error-container, #quiz-container, #result-container {
            display: none;
        }
        button {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:disabled {
            background-color: #ffb8c6;
            cursor: not-allowed;
        }
        .question {
            text-align: left;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 加载状态 -->
        <div id="loading" style="display: block;">
            <p>💖 正在验证你的专属链接...</p>
        </div>

        <!-- 2. 错误/已使用提示 -->
        <div id="error-container">
            <p id="error-message" class="error-message"></p>
        </div>

        <!-- 3. 答题区域 -->
        <div id="quiz-container">
            <h1>爱情测试</h1>
            <p>请完成以下测试获取你的专属结果</p>
            
            <!-- 这里可以放你的题目表单，这里只做演示 -->
            <div class="question">
                <label>1. 你的名字是？</label><br>
                <input type="text" id="userName" style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="输入名字">
            </div>

            <button id="submit-btn" onclick="submitQuiz()">提交并查看结果</button>
        </div>

        <!-- 4. 结果区域 -->
        <div id="result-container">
            <h1>💖 你的测试结果 💖</h1>
            <p id="result-text" style="font-size: 18px; line-height: 1.6; margin-top: 20px;"></p>
            <p style="font-size: 12px; color: #999; margin-top: 30px;">（48小时内通过原链接随时可查看此结果）</p>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 配置你的 Supabase 数据库信息
        // ==========================================
        const SUPABASE_URL = '你的_SUPABASE_URL'; // 替换为你的 URL
        const SUPABASE_ANON_KEY = '你的_SUPABASE_ANON_KEY'; // 替换为你的 anon key
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // 2. 获取 URL 中的 code 参数
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        // UI 控制函数
        function showSection(sectionId) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById(sectionId).style.display = 'block';
        }

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            showSection('error-container');
        }

        // ==========================================
        // 3. 页面初始化校验逻辑
        // ==========================================
        async function init() {
            if (!code) {
                showError('⚠️ 请通过带密钥的专属链接访问！');
                return;
            }

            // 去 Supabase 查询这个 code (假设你的表名是 codes)
            const { data, error } = await supabase
                .from('codes') 
                .select('*')
                .eq('code', code)
                .single();

            if (error || !data) {
                showError('⚠️ 查无此密钥，请确认链接是否正确！');
                return;
            }

            // 校验有效期：48小时 (按毫秒计算)
            const createdAt = new Date(data.created_at).getTime();
            const now = Date.now();
            const hours48 = 48 * 60 * 60 * 1000;
            
            if (now - createdAt > hours48) {
                showError('⚠️ 该链接已超过 48 小时有效期，已失效！');
                return;
            }

            // 校验状态
            if (data.status === 'used') {
                // 如果数据库已经是 used，检查本地缓存，判断是不是“本人”又点进来了
                const localCode = localStorage.getItem('lovetest_code');
                
                if (localCode === code) {
                    // 是本人，展示结果页
                    const localResult = localStorage.getItem('lovetest_result') || '测试结果加载成功！';
                    document.getElementById('result-text').innerText = localResult;
                    showSection('result-container');
                } else {
                    // 不是本人（换了手机/微信），拦截
                    showError('⚠️ 该密钥已经被使用过了，无法重复核销！');
                }
                return;
            }

            // 如果没核销且没过期，展示答题界面
            showSection('quiz-container');
        }

        // ==========================================
        // 4. 提交答题并核销逻辑
        // ==========================================
        async function submitQuiz() {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = '正在生成专属结果...';

            // 这里可以替换成你真实的算分/生成结果的逻辑
            const userName = document.getElementById('userName').value || '神秘人';
            const finalResult = `${userName}，你们的匹配度是 99%！天生一对！`;

            // 去 Supabase 更新状态为已核销 (used)
            const { error } = await supabase
                .from('codes')
                .update({ status: 'used' }) // 也可以记录 used_at 时间： { status: 'used', used_at: new Date().toISOString() }
                .eq('code', code);

            if (error) {
                alert('网络开小差了，请重试！');
                btn.disabled = false;
                btn.innerText = '提交并查看结果';
                return;
            }

            // 核销成功，将结果和 code 存入浏览器缓存（48小时内认出同一个人）
            localStorage.setItem('lovetest_code', code);
            localStorage.setItem('lovetest_result', finalResult);

            // 展示结果
            document.getElementById('result-text').innerText = finalResult;
            showSection('result-container');
        }

        // 启动校验
        init();
    </script>
</body>
</html>
